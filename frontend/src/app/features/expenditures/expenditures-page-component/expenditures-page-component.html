<div class="title-block">
    <div class="title-part">
        <p class="titles">Expenditures</p>
        <p class="sub-title grey-title">Track your spending and manage your budget</p>
    </div>
    <div class="buttons-block">
        <div class="date-range-block">
            <div class="from-date-block date-block">
                <label class="text">From date</label>
                <input class="text" type="date" name="from-date" id="from-date">
            </div>
            <div class="to-date-block date-block">
                <label class="text">To date</label>
                <input class="text" type="date" name="to-date" id="to-date">
            </div>
        </div>
        <button class="add-btn" (click)="openAddExpenseForm()">
            <img class="add-btn-plus icon-25px" src="assets/icons/white_plus.png" alt="white-plus-icon">
            <span class="add-text white-text">Add Expense</span>
        </button>
    </div>
</div>
<div class="upper-block">
    <app-overview-component
        [totalSpent$]="calculateTotalSpent()"
        [dailyAverage$]="calculateDailyAverage(getDaysPassedInCurrentMonth())"
        [transactions$]="getTransactionsQuantity()"
    ></app-overview-component>
    <app-spending-categories-preview
        [categoriesSummary$]="categoriesSummary$"
        [expenditureIcons]="expenditureIcons"
    ></app-spending-categories-preview>
</div>
<div class="botton-block">
    <app-budget-summary
        [totalSpent$]="calculateTotalSpent()"
    ></app-budget-summary>
    <app-recent-expenditures-preview
        [expenditures$]="expenditures$"
        [expenditureIcons]="expenditureIcons"
        (viewAllOpened)="handleViewAllVisibility($event)"
    ></app-recent-expenditures-preview>
    @if (isAddExpenseFormOpened) {
        <app-add-expense-form
            (expenseSaved)="handleExpenseSubmitted($event)"
            (cancelled)="closeAddExpenseForm()"
        ></app-add-expense-form>
    }
</div>
@if (isViewAllOpened) {
    <app-view-all-component
        [expenditures$]="expenditures$"
        [expenditureIcons]="expenditureIcons"
        (closed)="handleViewAllVisibility($event)"
    ></app-view-all-component>
}
