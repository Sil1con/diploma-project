<div class="top-block">
    <div class="title-block">
        <p class="titles">Income</p>
        <p class="sub-title grey-title">Understand where your money comes from</p>
    </div>
</div>
<div class="overview-block">
    <app-total-income-component
        [totalIncomeValue$]="totalIncomeValue$"
        [previousMonthIncome]="previousMonthIncome"
    ></app-total-income-component>
    <app-goal-income-component
        [totalIncomeValue$]="totalIncomeValue$"
        [incomeGoal]="incomeGoal"
    ></app-goal-income-component>
</div>
<app-income-sources-component
    [incomeSources$]="incomeSources$"
    [incomeIcons]="incomeIcons"
    (viewAllOpened)="handleViewAllVisibility($event)"
></app-income-sources-component>
<button class="add-btn" (click)="openAddIncomeForm()">
    <img class="add-btn-plus" src="assets/icons/blue_plus.png" alt="add-button-icon">
    <p class="add-btn-text">Add Source</p>
</button>
@if (isAddIncomeFormOpened) {
    <app-add-income-form
        (incomeSaved)="handleIncomeSubmitted($event)"
        (cancelled)="closeAddIncomeForm()"
    ></app-add-income-form>
}
@if (isViewAllOpened) {
    <app-view-all-incomes
        [incomeSources$]="incomeSources$"
        [incomeIcons]="incomeIcons"
        (viewAllClosed)="handleViewAllVisibility($event)"
        (deletedIncome)="handleIncomeDeleted($event)"
    ></app-view-all-incomes>
}
