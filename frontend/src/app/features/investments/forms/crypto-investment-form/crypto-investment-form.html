<div class="form-layout">
    <div class="title-block">
        <p class="titles">Add Crypto</p>
        <p class="grey-title">Set up a new asset in your portfolio</p>
    </div>
    <form [formGroup]="cryptoForm">
        <div class="field-block type-block static-block">
            <label>Type</label>
            <input class="static-input" formControlName="type" readonly>
        </div>
        <div class="fields-flexbox">
            <div class="field-block">
                <label>Cryptocurrency Name</label>
                <input formControlName="name" placeholder="e.g., Bitcoin">    
            </div>
            <div class="field-block">
                <label>Symbol</label>
                <input formControlName="symbol" placeholder="e.g., BTC">
            </div>
            <div class="field-block">
                <label>Quantity</label>
                <input type="number" formControlName="quantity" placeholder="e.g., 10">
            </div>
            <div class="field-block">
                <label>Price Per Unit</label>
                <input type="number" formControlName="pricePerUnit" placeholder="0.00">
            </div>
            <div class="field-block">
                <label>Purchase Date</label>
                <input type="date" formControlName="purchaseDate">
            </div>
            <div class="field-block">
                <label>Exchange / Wallet</label>
                <input type="text" formControlName="wallet" placeholder="e.g., Binance">
            </div>
        </div>
        <div class="field-block note-block">
            <label>Notes <span class="optional">(optional)</span></label>
            <textarea 
                formControlName="notes"
                placeholder="Add any additional notes about this investment..."
                maxlength="100"
            ></textarea>
        </div>
    </form>
    <div class="buttons-block">
        <button class="cancel-btn" (click)="onCancel()">Cancel</button>
        <button class="create-btn crypto" (click)="onSubmit()">Add Crypto</button>
    </div>
</div>
