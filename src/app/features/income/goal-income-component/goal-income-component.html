<div class="goal-block">
    <div class="goal-icon-block">
        <img class="icon" src="assets/category_icons/target.png" alt="goal-income-icon">
    </div>
    <div class="goal-info-block">
        <p class="grey-title goal-title">Income Goal</p>
        <p class="goal-income-value">{{ incomeGoal | currency: 'EUR' : 'symbol-narrow' : '2.2-2' }}</p>
        <div class="progress-bar-block">
            <div>
                <div class="progress-bar-background">
                    <div 
                        class="progress-bar"
                        [style.width.%]="goalPercent"
                    ></div>
                </div>
                <span class="progress-percent-background">
                    <p class="progress-percent">{{ goalPercent | percent }}</p>
                </span>
            </div>
            <p class="grey-title goal-text">of {{ incomeGoal | currency: 'EUR' : 'symbol-narrow' : '2.2-2' }} goal</p>
        </div>
    </div>
</div>
