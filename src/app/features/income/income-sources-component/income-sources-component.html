<div class="sources-block">
    <div class="title-block">
        <p class="source-title titles">Source Categories</p>
        <p class="source-descr grey-title">Breakdown of your income sources</p>
        <button class="view-all-btn">View all</button>
    </div>
    <div class="sources-flexbox">
        @for (income of incomeSources.slice(0, 4); track income.id) {
            <div class="source">
                <div 
                    class="source-icon-block"
                    [class]="income.category"
                >
                    <img 
                        class="icon"
                        [src]="incomesIcons[income.category]" 
                        [alt]="income.category + '-icon'">
                </div>
                <div class="source-description">
                    <p class="source-name grey-title">{{ income.name }}</p>
                    <p class="source-income titles">{{ income.amount | currency: 'EUR' : 'symbol-narrow' : '2.2-2'}}</p>
                    <p class="source-category grey-title">{{ income.category | capitalLetterPipe }}</p>
                </div>
            </div>
        }
    </div>
</div>
