<div class="form-layout">
    <div class="title-block">
        <p class="titles">Create Investment</p>
        <p class="grey-title">Set up a new asset in your portfolio</p>
    </div>
    <form [formGroup]="bondForm">
        <div class="field-block type-block">
            <label>Type</label>
            <input formControlName="type" readonly>
        </div>
        <div class="fields-flexbox">
            <div class="field-block">
                <label>Bond Name</label>
                <input formControlName="bondName" placeholder="e.g., Government Bond">    
            </div>
            <div class="field-block">
                <label>Issuer</label>
                <input formControlName="issuer" placeholder="e.g., Government">
            </div>
            <div class="field-block">
                <label>Face Value</label>
                <input type="number" formControlName="faceValue" placeholder="0.00">
            </div>
            <div class="field-block">
                <label>Purchase Price</label>
                <input type="number" formControlName="purchasePrice" placeholder="0.00">
            </div>
            <div class="field-block">
                <label>Coupon Rate (%)</label>
                <input type="number" formControlName="couponRate" placeholder="e.g., 5">
            </div>
            <div class="field-block">
                <label>Purchase Date</label>
                <input type="date" formControlName="purchaseDate">
            </div>
            <div class="field-block">
                <label>Maturity Date</label>
                <input type="date" formControlName="maturityDate">
            </div>
        </div>
        <div class="field-block note-block">
            <label>Notes <span class="optional">(optional)</span></label>
            <textarea 
                formControlName="notes"
                placeholder="Add any additional notes about this bond..."
                maxlength="200"
            ></textarea>
        </div>
    </form>
    <div class="buttons-block">
        <button class="cancel-btn">Cancel</button>
        <button class="create-btn">Create Investment</button>
    </div>
</div>
