<div class="form-layout">
    <div class="title-block">
        <p class="titles">Add Stock</p>
        <p class="grey-title">Set up a new asset in your portfolio</p>
    </div>
    <form [formGroup]="stockForm">
        <div class="field-block type-block static-block">
            <label>Type</label>
            <input class="static-input" formControlName="type" readonly>
        </div>
        <div class="fields-flexbox">
            <div class="field-block">
                <label>Stock Name</label>
                <input formControlName="investmentName" placeholder="e.g., Apple Inc.">    
            </div>
            <div class="field-block">
                <label>Ticker / Symbol</label>
                <input formControlName="ticker" placeholder="e.g., AAPL">
            </div>
            <div class="field-block">
                <label>Quantity</label>
                <input type="number" formControlName="quantity" placeholder="e.g., 10">
            </div>
            <div class="field-block">
                <label>Purchase Price</label>
                <input type="number" formControlName="purchasePrice" placeholder="0.00">
            </div>
            <div class="field-block">
                <label>Broker Account</label>
                <input type="text" formControlName="brokerAccount" placeholder="e.g., Trading 212">
            </div>
            <div class="field-block">
                <label>Purchase Date</label>
                <input type="date" formControlName="purchaseDate">
            </div>
        </div>
        <div class="field-block note-block">
            <label>Notes <span class="optional">(optional)</span></label>
            <textarea 
                formControlName="notes"
                placeholder="Add any additional notes about this investment..."
                maxlength="100"
            ></textarea>
        </div>
    </form>
    <div class="buttons-block">
        <button class="cancel-btn" (click)="onCancel()">Cancel</button>
        <button class="create-btn stock" (click)="onSubmit()">Add Stock</button>
    </div>
</div>
